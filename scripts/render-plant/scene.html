<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three'
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'

const P = new URLSearchParams(location.search)
const VIEW = P.get('view') || 'hero'
const W = +(P.get('w') || 1600), H = +(P.get('h') || 1200)
const BLUE = false
const SPLIT = VIEW === 'design'

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1); renderer.setSize(W, H)
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.82
document.body.appendChild(renderer.domElement)

const scene = new THREE.Scene()
const pm = new THREE.PMREMGenerator(renderer)
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture

// sky gradient
function sky(top, bottom) {
  const c = document.createElement('canvas'); c.width = 4; c.height = 512
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 512)
  gr.addColorStop(0, top); gr.addColorStop(1, bottom); g.fillStyle = gr; g.fillRect(0, 0, 4, 512)
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t
}
scene.background = BLUE ? new THREE.Color('#0b1a33') : sky('#7f9bbd', '#dfe6ee')
if (!BLUE) scene.fog = new THREE.Fog('#d9e1ea', 90, 260)

const sun = new THREE.DirectionalLight('#fff4e6', 2.6)
sun.position.set(60, 90, 40); sun.castShadow = true
sun.shadow.mapSize.set(4096, 4096)
Object.assign(sun.shadow.camera, { left: -120, right: 120, top: 120, bottom: -120, near: 1, far: 300 })
sun.shadow.bias = -0.0004
scene.add(sun)
scene.add(new THREE.HemisphereLight('#cfe0ff', '#8a8580', 0.6))

const M = {
  steel: new THREE.MeshStandardMaterial({ color: '#3d5a80', metalness: 0.4, roughness: 0.55 }),
  steelY: new THREE.MeshStandardMaterial({ color: '#c9a227', metalness: 0.3, roughness: 0.5 }),
  ss: new THREE.MeshStandardMaterial({ color: '#d8dde2', metalness: 0.85, roughness: 0.28 }),
  ins: new THREE.MeshStandardMaterial({ color: '#b9c0c7', metalness: 0.7, roughness: 0.4 }),
  green: new THREE.MeshStandardMaterial({ color: '#4f8a5b', metalness: 0.2, roughness: 0.5 }),
  yellow: new THREE.MeshStandardMaterial({ color: '#d9b43a', metalness: 0.2, roughness: 0.5 }),
  red: new THREE.MeshStandardMaterial({ color: '#b5463c', metalness: 0.2, roughness: 0.5 }),
  white: new THREE.MeshStandardMaterial({ color: '#eef0f2', metalness: 0.3, roughness: 0.45 }),
  concrete: new THREE.MeshStandardMaterial({ color: '#9c9a95', roughness: 0.95 }),
  asphalt: new THREE.MeshStandardMaterial({ color: '#5d6066', roughness: 0.95 }),
  haze: new THREE.MeshStandardMaterial({ color: '#aab4bf', roughness: 1 }),
  grate: new THREE.MeshStandardMaterial({ color: '#6b7682', metalness: 0.5, roughness: 0.6 }),
  crane: new THREE.MeshStandardMaterial({ color: '#e0a21b', metalness: 0.3, roughness: 0.45 }),
  dark: new THREE.MeshStandardMaterial({ color: '#2a2f36', metalness: 0.3, roughness: 0.6 }),
  person: new THREE.MeshStandardMaterial({ color: '#ff7a1a', roughness: 0.6 }),
  helmet: new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.4 }),
}

const root = new THREE.Group(); scene.add(root)
function add(geo, mat, x, y, z, rx = 0, ry = 0, rz = 0) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.rotation.set(rx, ry, rz)
  m.castShadow = true; m.receiveShadow = true; root.add(m); return m
}
const box = (w, h, d, mat, x, y, z, ry = 0) => add(new THREE.BoxGeometry(w, h, d), mat, x, y, z, 0, ry)
const cyl = (r, h, mat, x, y, z, rx = 0, ry = 0, rz = 0, seg = 32) => add(new THREE.CylinderGeometry(r, r, h, seg), mat, x, y, z, rx, ry, rz)

// ground
const ground = add(new THREE.PlaneGeometry(600, 600), M.concrete, 0, 0, 0, -Math.PI / 2)
ground.castShadow = false
box(600, 0.02, 7, M.asphalt, 0, 0.005, 14); box(7, 0.02, 600, M.asphalt, 66, 0.005, 0)
for (let i = 0; i < 14; i++) box(14 + (i*7)%12, 6 + (i*5)%14, 12, M.haze, -150 + i * 24, 5, -120 - (i*13)%30)
// road markings
for (let i = -8; i < 8; i++) box(4, 0.02, 0.25, M.white, i * 9, 0.01, 14)

// H column helper
function hcol(x, z, h, mat = M.steel) { box(0.45, h, 0.45, mat, x, h / 2, z) }

// ===== pipe rack along X =====
const RACK_Z = 0, RACK_X0 = -60, RACK_X1 = 50, BAYS = 12
const tiers = [5, 8, 11]
for (let i = 0; i <= BAYS; i++) {
  const x = RACK_X0 + (RACK_X1 - RACK_X0) * i / BAYS
  hcol(x, RACK_Z - 3, 12); hcol(x, RACK_Z + 3, 12)
  for (const t of tiers) box(0.4, 0.4, 6.6, M.steel, x, t, RACK_Z)
  box(0.25, 0.25, 8.5, M.steel, x, 6.5, RACK_Z, 0).rotation.x = Math.atan2(6, 7) // brace-ish
}
// longitudinal beams
for (const t of tiers) for (const z of [-3, 3]) box(RACK_X1 - RACK_X0, 0.3, 0.3, M.steel, (RACK_X0 + RACK_X1) / 2, t, RACK_Z + z)
// pipes on tiers
const L = RACK_X1 - RACK_X0 + 4, CX = (RACK_X0 + RACK_X1) / 2
const pipeSets = [
  [5, [[-2.3, 0.45, M.ins], [-1.2, 0.35, M.ss], [-0.2, 0.3, M.green], [0.8, 0.5, M.ins], [2.0, 0.35, M.ss]]],
  [8, [[-2.2, 0.3, M.yellow], [-1.3, 0.4, M.ss], [-0.2, 0.55, M.ins], [1.0, 0.3, M.red], [2.0, 0.4, M.ss]]],
  [11, [[-2.0, 0.6, M.ins], [-0.4, 0.45, M.ss], [1.0, 0.3, M.green], [2.0, 0.3, M.ss]]],
]
for (const [t, ps] of pipeSets) for (const [dz, r, mat] of ps) {
  cyl(r, L, mat, CX, t + 0.2 + r, RACK_Z + dz, 0, 0, Math.PI / 2, 24)
}

// ===== distillation columns =====
function column(x, z, r, h) {
  cyl(r, h, M.white, x, h / 2 + 1, z)
  add(new THREE.SphereGeometry(r, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), M.white, x, h + 1, z)
  cyl(r + 0.6, 1, M.concrete, x, 0.5, z)
  for (let y = 6; y < h; y += 7) {
    add(new THREE.TorusGeometry(r + 0.9, 0.08, 6, 48), M.steelY, x, y + 1.1, z, Math.PI / 2)
    add(new THREE.RingGeometry(r + 0.05, r + 0.9, 48), M.grate, x, y, z, -Math.PI / 2).material.side = THREE.DoubleSide
  }
  box(0.6, h, 0.08, M.steelY, x + r + 0.35, h / 2, z)
  // overhead line down to rack
  cyl(0.25, h - 10, M.ss, x - r - 0.5, h / 2 + 5, z)
}
column(-30, -16, 2.2, 42); column(-20, -18, 1.6, 34); column(-10, -16, 2.6, 46)

// ===== storage tanks =====
function tank(x, z, r, h) {
  cyl(r, h, M.white, x, h / 2, z, 0, 0, 0, 64)
  add(new THREE.ConeGeometry(r * 1.01, 1.5, 64), M.white, x, h + 0.75, z)
  add(new THREE.TorusGeometry(r + 0.05, 0.1, 6, 64), M.steelY, x, h, z, Math.PI / 2)
  // spiral stair approx
  for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 1.2; box(1.2, 0.12, 0.6, M.steelY, x + Math.cos(a) * (r + 0.7), (i / 24) * h, z + Math.sin(a) * (r + 0.7), -a) }
}
tank(30, -24, 9, 14); tank(52, -22, 7, 12); tank(10, -30, 6, 10)
// spheres
function sphere(x, z, r) {
  add(new THREE.SphereGeometry(r, 48, 32), M.white, x, r + 3, z)
  for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; cyl(0.25, r + 3, M.steel, x + Math.cos(a) * r * 0.85, (r + 3) / 2, z + Math.sin(a) * r * 0.85) }
}
sphere(-50, -22, 6); sphere(-62, -20, 5)

// ===== steel structure (process unit) =====
function structure(x0, z0, nx, nz, levels, sp = 5, lh = 6) {
  for (let i = 0; i <= nx; i++) for (let k = 0; k <= nz; k++) hcol(x0 + i * sp, z0 + k * sp, levels * lh)
  for (let l = 1; l <= levels; l++) {
    const y = l * lh
    for (let i = 0; i <= nx; i++) box(0.35, 0.5, nz * sp, M.steel, x0 + i * sp, y, z0 + nz * sp / 2)
    for (let k = 0; k <= nz; k++) box(nx * sp, 0.5, 0.35, M.steel, x0 + nx * sp / 2, y, z0 + k * sp)
    if (l < levels) box(nx * sp, 0.08, nz * sp, M.grate, x0 + nx * sp / 2, y + 0.3, z0 + nz * sp / 2)
    // handrail
    box(nx * sp, 0.06, 0.06, M.steelY, x0 + nx * sp / 2, y + 1.3, z0)
  }
  // equipment on levels
  cyl(1.4, 5, M.ss, x0 + sp, lh + 2.9, z0 + sp, Math.PI / 2, 0, 0)
  cyl(1.2, 4, M.ins, x0 + sp * 2.4, lh * 2 + 2.6, z0 + sp * 0.9, 0, 0, Math.PI / 2)
  cyl(1.0, 6, M.white, x0 + sp * 1.5, lh * 3 + 3.2, z0 + sp)
}
structure(8, 10, 4, 2, 3)
structure(-48, 9, 3, 2, 2)

// pumps & small equipment along rack
for (let i = 0; i < 8; i++) {
  const x = -54 + i * 12
  box(2.2, 0.4, 1.2, M.concrete, x, 0.2, -6)
  cyl(0.45, 1.6, M.green, x - 0.4, 0.9, -6, 0, 0, Math.PI / 2)
  box(0.7, 0.9, 0.9, M.dark, x + 0.7, 0.85, -6)
  cyl(0.15, 4.6, M.ss, x - 0.4, 3.0, -5.3)
}

// ===== construction site =====
M.skin = new THREE.MeshStandardMaterial({ color: '#c99a78', roughness: 0.7 })
M.vest = new THREE.MeshStandardMaterial({ color: '#ff7a1a', roughness: 0.6, emissive: '#3a1400' })
M.pants = new THREE.MeshStandardMaterial({ color: '#2c3646', roughness: 0.8 })
M.hatY = new THREE.MeshStandardMaterial({ color: '#f2c200', roughness: 0.4 })
M.paper = new THREE.MeshStandardMaterial({ color: '#f4f6fa', roughness: 0.9 })
M.cone = new THREE.MeshStandardMaterial({ color: '#ff5a1f', roughness: 0.6 })
M.spark = new THREE.MeshBasicMaterial({ color: '#ffd27a' })
M.wood = new THREE.MeshStandardMaterial({ color: '#8a6a45', roughness: 0.9 })

function worker(x, y, z, ry = 0, opt = {}) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; root.add(g)
  const part = (geo, mat, px, py, pz, rx = 0, rz = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(px, py, pz); m.rotation.set(rx, 0, rz); m.castShadow = true; g.add(m); return m }
  const kneel = opt.kneel
  if (kneel) {
    part(new THREE.BoxGeometry(0.16, 0.16, 0.55), M.pants, -0.11, 0.1, 0.1)
    part(new THREE.BoxGeometry(0.16, 0.45, 0.16), M.pants, 0.11, 0.25, -0.15)
    part(new THREE.BoxGeometry(0.16, 0.16, 0.4), M.pants, 0.11, 0.48, 0.0)
  } else {
    part(new THREE.BoxGeometry(0.17, 0.85, 0.2), M.pants, -0.11, 0.43, 0)
    part(new THREE.BoxGeometry(0.17, 0.85, 0.2), M.pants, 0.11, 0.43, 0)
  }
  const hy = kneel ? 0.5 : 0.85
  part(new THREE.BoxGeometry(0.46, 0.62, 0.26), M.vest, 0, hy + 0.33, 0, kneel ? 0.35 : 0)
  const armRx = opt.reach ? -1.1 : 0.1
  part(new THREE.BoxGeometry(0.12, 0.6, 0.12), M.vest, -0.3, hy + 0.32, opt.reach ? 0.2 : 0, armRx)
  part(new THREE.BoxGeometry(0.12, 0.6, 0.12), M.vest, 0.3, hy + 0.32, opt.reach ? 0.2 : 0, opt.point ? -1.4 : armRx)
  part(new THREE.SphereGeometry(0.13, 16, 12), M.skin, 0, hy + 0.78, kneel ? 0.12 : 0)
  const hat = part(new THREE.SphereGeometry(0.16, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), opt.hat || M.helmet, 0, hy + 0.82, kneel ? 0.12 : 0)
  part(new THREE.CylinderGeometry(0.2, 0.2, 0.02, 20), opt.hat || M.helmet, 0, hy + 0.82, kneel ? 0.15 : 0.03)
  return g
}

function crane(cx, cz, ry, angDeg, boomLen, hookY, color = M.crane) {
  box(4, 1.6, 11, color, cx, 1.5, cz, ry)
  const g = new THREE.Group(); g.position.set(cx, 0, cz); g.rotation.y = ry; root.add(g)
  for (const dz of [-4, -1.3, 1.3, 4]) for (const dx of [-2.1, 2.1]) { const w = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.75, 0.6, 24), M.dark); w.rotation.z = Math.PI / 2; w.position.set(dx, 0.75, dz); w.castShadow = true; g.add(w) }
  for (const dz of [-4.6, 4.6]) for (const dx of [-1, 1]) { const o = new THREE.Mesh(new THREE.BoxGeometry(3, 0.3, 0.4), color); o.position.set(dx * 3, 0.5, dz); g.add(o); const pd = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.12, 0.9), M.wood); pd.position.set(dx * 4.3, 0.06, dz); g.add(pd) }
  const cab = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.8, 2), M.dark); cab.position.set(1.4, 3, 4.2); g.add(cab)
  const body = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.4, 4.4), color); body.position.set(0, 3.5, -1.5); body.castShadow = true; g.add(body)
  // lattice-ish boom: two chords + rungs
  const pivot = new THREE.Group(); pivot.position.set(0, 4.4, -2.8); g.add(pivot)
  const arm = new THREE.Group(); pivot.add(arm); arm.rotation.x = -(Math.PI / 2 - THREE.MathUtils.degToRad(angDeg))
  for (const dx of [-0.55, 0.55]) for (const dz of [-0.55, 0.55]) { const c = new THREE.Mesh(new THREE.BoxGeometry(0.16, boomLen, 0.16), color); c.position.set(dx, boomLen / 2, dz); c.castShadow = true; arm.add(c) }
  for (let y = 1; y < boomLen; y += 1.6) { const r = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 0.08), color); r.position.set(0, y, 0.55); arm.add(r); const r2 = r.clone(); r2.position.z = -0.55; arm.add(r2) }
  scene.updateMatrixWorld(true)
  const tip = new THREE.Vector3(0, boomLen, 0).applyMatrix4(arm.matrixWorld)
  cyl(0.05, tip.y - hookY, M.dark, tip.x, (tip.y + hookY) / 2, tip.z)
  box(0.6, 0.9, 0.45, color, tip.x, hookY, tip.z)
  return tip
}

function sling(tip, hookY, loadY, half, axis = 'x') {
  for (const d of [-half, half]) {
    const dx = axis === 'x' ? d : 0, dz = axis === 'z' ? d : 0
    const len = Math.hypot(d, hookY - loadY)
    const m = cyl(0.03, len, M.dark, tip.x + dx / 2, (hookY + loadY) / 2, tip.z + dz / 2)
    if (axis === 'x') m.rotation.z = -Math.atan2(d, hookY - loadY); else m.rotation.x = Math.atan2(d, hookY - loadY)
  }
}

let SPOOL = null, MEET = null, WELD = null

// crane A: pipe spool onto rack
{
  const tip = crane(36, 13, -0.42, 70, 40, 19)
  const ly = 15.2
  sling(tip, 19, ly, 3)
  cyl(0.55, 9, M.ss, tip.x, ly, tip.z, 0, 0, Math.PI / 2)
  for (const dx of [-4.5, 4.5]) add(new THREE.TorusGeometry(0.75, 0.15, 12, 32), M.ss, tip.x + dx, ly, tip.z, 0, Math.PI / 2)
  SPOOL = new THREE.Vector3(tip.x, ly, tip.z)
  worker(tip.x - 2.5, 11.2, RACK_Z - 2.4, 0.4, { reach: true }); worker(tip.x + 3.2, 11.2, RACK_Z + 2.2, 2.6, { reach: true })
  // tag-line worker on ground
  worker(tip.x + 1, 0, RACK_Z + 6, 2.8, { point: true })
}
// crane B: steel beam to process structure (top level under construction)
{
  const tip = crane(18, 36, 0, 64, 46, 26, M.crane)
  const ly = 22.4
  sling(tip, 26, ly, 2.5, 'x')
  box(6, 0.5, 0.35, M.steel, tip.x, ly, tip.z)
  for (const [x, z] of [[18, 15], [23, 20], [13, 10]]) worker(x, 18.3, z, Math.random() * 6, { reach: true })
  worker(10, 12.3, 12, 1.2); worker(20, 6.3, 18, 4)
}
// scaffolding around tallest column
function scaffold(x0, z0, w, d, h) {
  for (let i = 0; i <= w; i += 2) for (const z of [z0, z0 + d]) cyl(0.05, h, M.steelY, x0 + i, h / 2, z, 0, 0, 0, 8)
  for (let k = 0; k <= d; k += 2) for (const x of [x0, x0 + w]) cyl(0.05, h, M.steelY, x, h / 2, z0 + k, 0, 0, 0, 8)
  for (let y = 2; y <= h; y += 2) {
    for (const z of [z0, z0 + d]) box(w, 0.05, 0.05, M.steelY, x0 + w / 2, y, z)
    for (const x of [x0, x0 + w]) box(0.05, 0.05, d, M.steelY, x, y, z0 + d / 2)
    if (y % 4 === 0) box(w, 0.06, 1.2, M.wood, x0 + w / 2, y, z0 + 0.6)
  }
}
scaffold(-35, -21, 10, 10, 30)
worker(-31, 20, -20.4, 0, { reach: true }); worker(-28, 12, -20.4, 0.3)
scaffold(18, 3.8, 8, 2, 12)

// laydown yard: pipe stacks, beams, cones
for (let r = 0; r < 3; r++) for (let i = 0; i < 6 - r; i++) cyl(0.4, 10, M.ss, -30 + i * 0.82 + r * 0.41, 0.42 + r * 0.72, 26, 0, 0, Math.PI / 2)
box(10.5, 0.2, 0.3, M.wood, -28, 0.1, 22); box(10.5, 0.2, 0.3, M.wood, -28, 0.1, 30)
for (let r = 0; r < 3; r++) for (let i = 0; i < 4; i++) box(9, 0.35, 0.35, M.steel, -42, 0.2 + r * 0.38, 22 + i * 0.5)
for (let i = 0; i < 10; i++) add(new THREE.ConeGeometry(0.22, 0.7, 16), M.cone, -48 + i * 4, 0.35, 19)
// flatbed truck with pipes
box(3, 1.1, 14, M.dark, 54, 1.4, 28); box(3, 2.6, 3, M.white, 54, 2.2, 36.5)
for (let i = 0; i < 3; i++) cyl(0.5, 12, M.ins, 53 + i * 1.05, 2.5, 28)

// on-site meeting (함께 개발): table with drawings
{
  const tx = -14, tz = 24
  box(2.4, 0.08, 1.4, M.wood, tx, 1.0, tz); for (const [dx, dz] of [[-1, -0.6], [1, -0.6], [-1, 0.6], [1, 0.6]]) box(0.08, 1.0, 0.08, M.dark, tx + dx, 0.5, tz + dz)
  box(1.6, 0.01, 1.0, M.paper, tx - 0.2, 1.05, tz, 0.1)
  const bp = box(0.9, 0.012, 0.6, new THREE.MeshStandardMaterial({ color: '#2b5fae' }), tx + 0.7, 1.06, tz + 0.2, -0.2)
  worker(tx - 1.7, 0, tz, Math.PI / 2, { point: true }); worker(tx + 1.7, 0, tz - 0.3, -Math.PI / 2, { hat: M.hatY })
  worker(tx, 0, tz - 1.5, 0); worker(tx + 0.5, 0, tz + 1.5, Math.PI, { hat: M.hatY })
  MEET = new THREE.Vector3(tx, 1, tz)
}
// field welding (실행): pipe on stands, kneeling welder with sparks
{
  const wx = 4, wz = 24
  for (const dx of [-3, 3]) { box(0.6, 0.9, 0.9, M.dark, wx + dx, 0.45, wz) }
  cyl(0.6, 4, M.ss, wx - 2, 1.5, wz, 0, 0, Math.PI / 2); cyl(0.6, 4, M.ss, wx + 2.05, 1.5, wz, 0, 0, Math.PI / 2)
  add(new THREE.TorusGeometry(0.62, 0.06, 8, 40), M.dark, wx, 1.5, wz, 0, Math.PI / 2)
  worker(wx + 0.2, 0, wz + 1.2, Math.PI, { kneel: true, reach: true, hat: M.dark })
  const glow = new THREE.PointLight('#ffb347', 30, 8, 2); glow.position.set(wx, 1.4, wz + 0.65); scene.add(glow)
  add(new THREE.SphereGeometry(0.09, 12, 8), M.spark, wx, 1.35, wz + 0.62)
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * Math.PI * 2, r = Math.random() * 1.0, dy = -Math.random() * 1.2
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.02, 0.12 + Math.random() * 0.2), M.spark)
    m.position.set(wx + Math.cos(a) * r * 0.6, 1.35 + dy * 0.9, wz + 0.65 + Math.abs(Math.sin(a)) * r)
    m.rotation.set(Math.random(), Math.random(), Math.random()); scene.add(m)
  }
  worker(wx + 2.4, 0, wz + 1.6, 3.6); worker(wx - 3, 0, wz + 1.4, 2.6, { hat: M.hatY })
  // gas bottles + welding machine
  for (let i = 0; i < 3; i++) cyl(0.15, 1.4, i ? M.green : M.red, wx + 5 + i * 0.4, 0.7, wz - 1)
  box(0.8, 0.7, 0.5, M.steel, wx + 5.6, 0.35, wz + 0.6)
  WELD = new THREE.Vector3(wx, 1.4, wz)
}

// ===== split: right half as design drawing =====
if (SPLIT) {
  const lines = new THREE.Group(); const hide = []
  root.traverse((o) => {
    if (!o.isMesh || o === ground || o.material === M.haze || o.material === M.asphalt) return
    o.updateMatrixWorld(); const p = new THREE.Vector3().setFromMatrixPosition(o.matrixWorld)
    if (p.x - p.z * 0.6 < 4) return
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 25), new THREE.LineBasicMaterial({ color: '#1f4fbf' }))
    e.applyMatrix4(o.matrixWorld); lines.add(e)
    const f = new THREE.Mesh(o.geometry, new THREE.MeshBasicMaterial({ color: '#cfe0ff', transparent: true, opacity: 0.45, depthWrite: false }))
    f.applyMatrix4(o.matrixWorld); lines.add(f); hide.push(o)
  })
  hide.forEach((o) => (o.visible = false)); scene.add(lines)
}
// ===== blueprint mode: replace with edges =====
if (BLUE) {
  const lines = new THREE.Group()
  root.traverse((o) => {
    if (!o.isMesh || o === ground || o.material === M.haze || o.material === M.asphalt) return
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 25), new THREE.LineBasicMaterial({ color: '#8fc1ff', transparent: true, opacity: 0.85 }))
    o.updateMatrixWorld(); e.applyMatrix4(o.matrixWorld); lines.add(e)
    const f = new THREE.Mesh(o.geometry, new THREE.MeshBasicMaterial({ color: '#163a6e', transparent: true, opacity: 0.55, depthWrite: false }))
    f.applyMatrix4(o.matrixWorld); lines.add(f)
  })
  root.visible = false; scene.add(lines)
  const grid = new THREE.GridHelper(400, 160, '#2d5a9a', '#173563'); grid.position.y = 0.01; scene.add(grid)
}

// ===== cameras =====
const cam = new THREE.PerspectiveCamera(40, W / H, 0.5, 1000)
const views = {
  hero: [[66, 20, 50], [-2, 11, 0], 44],
  develop: [[-20, 120, 110], [-4, 0, -6], 34],
  lift: [[0,0,0],[0,0,0],50],
  design: [[62, 34, 64], [-4, 9, -4], 42],
  build: [[50, 7, 30], [28, 12, 0], 50],
}
let [p, t, fov] = views[VIEW]
if (VIEW === 'build') { t = [WELD.x - 1.5, WELD.y + 0.6, WELD.z - 1.5]; p = [WELD.x + 6.5, 2.6, WELD.z + 6.5]; fov = 44 }
if (VIEW === 'develop') { t = [MEET.x - 2, MEET.y + 2.5, MEET.z - 8]; p = [MEET.x + 5, 2.6, MEET.z + 7]; fov = 50 }
if (VIEW === 'lift') { t = [SPOOL.x - 2, SPOOL.y - 1, SPOOL.z]; p = [SPOOL.x + 24, 5, SPOOL.z + 14]; fov = 50 }
cam.fov = fov; cam.position.set(...p); cam.lookAt(...t); cam.updateProjectionMatrix()
renderer.render(scene, cam)
window.__done = true
</script></body></html>
